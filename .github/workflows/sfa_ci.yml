name: SFA-One Metabolic Health Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Verify Metabolic Dependencies
        run: uv sync --frozen
      - name: Run Innate Immune Checks
        run: uv run pytest modules/immunity/
